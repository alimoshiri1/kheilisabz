<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | خیلی سبز</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="kheilisabz login-page">
  <header>
    <div class="bigheader">
      <a class="logo" href="index.html"><img src="images/logo-desktop.svg" alt="لوگوی خیلی سبز"></a>
      <div class="header-menu">
        <ul id="nav-ul"></ul>
      </div>
      <div class="header-actions">
        <a class="cart-link" href="https://kheilisabz.com/cart" target="_blank" rel="noopener" aria-label="سبد خرید">
          <img src="images/icon-cart.svg" width="24" height="24" alt="">
        </a>
        <div class="login-wrap">
          <a class="login-button" href="login-popup.html"><span id="login-label">ورود یا ثبت‌نام</span></a>
        </div>
      </div>
    </div>
    <div class="container menu-segment">
      <div class="megainner" id="megainner" aria-hidden="true">
        <div class="mega-flex">
          <ul class="menubar level-2" id="menubar"></ul>
          <div class="menuScroll" id="menuscroll"></div>
        </div>
      </div>
    </div>
    <div class="mobile-header">
      <div class="container mobile-header-content">
        <img class="burger" id="burger" src="images/icon-menu.svg" width="24" height="24" alt="منو">
        <a class="mlogo" href="index.html"><img src="images/logo-mobile.svg" alt="لوگوی خیلی سبز"></a>
      </div>
    </div>
  </header>

  <div class="search-segment">
    <div class="bread_crumbs">
      <div class="container bread_crumbs_container">
        <nav aria-label="breadcrumb">
          <ol>
            <li><a class="text_bread_crumb" href="index.html">خیلی سبز</a></li>
            <li aria-hidden="true" class="bc-sep">|</li>
            <li><a class="text_bread_crumb disabled" href="login.html">Login</a></li>
          </ol>
        </nav>
      </div>
    </div>
    <div class="search-box-outer">
      <div class="search-box-mb">
        <div class="searchinputDesktop">
          <input type="text" id="search-input" placeholder="جستجو در خیلی سبز" autocomplete="off">
          <button class="search-btn" type="button" aria-label="جستجو">
            <img src="images/icon-search.svg" alt="">
          </button>
        </div>
      </div>
    </div>
  </div>

  <main class="main-container not-home-page">
    <div class="container">
      <div class="login-card">
        <p class="login-title">ورود یا ثبت‌نام</p>
        <form id="login-form" novalidate>
          <label class="login-label" for="phone-input">شماره موبایل</label>
          <input class="login-input" type="tel" id="phone-input" placeholder="09123456789" maxlength="11" inputmode="numeric" autocomplete="tel">
          <div id="code-block" class="hidden">
            <label class="login-label" for="code-input">کد تایید</label>
            <input class="login-input" type="text" id="code-input" placeholder="کد ۴ رقمی" maxlength="4" inputmode="numeric">
            <label class="login-label" for="name-input">نام</label>
            <input class="login-input" type="text" id="name-input" placeholder="نام شما" maxlength="30">
          </div>
          <button class="login-submit" type="submit" id="login-submit">دریافت کد</button>
          <p class="login-error hidden" id="login-error"></p>
          <p class="login-hint" id="login-hint">شماره موبایل خود را وارد کنید تا کد تایید برایتان ارسال شود.</p>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <div class="container_bottom_navigation" id="bottom-nav"></div>

  <div id="popup-root"></div>
  <div id="drawer-root"></div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
